databases:
  - name: backup-strategies-db
    plan: free
    databaseName: backup_strategies
    user: backup_user

services:
  - type: web
    name: database-backup-strategies
    runtime: python
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn backup_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backup-strategies-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
